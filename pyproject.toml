[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vscan"
version = "0.3.1"
description = "V.SCAN by Vazha Lomtatidze — Lightweight vulnerability scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vazha Lomtatidze" }]
keywords = ["network", "security", "vulnerability", "remediation", "openvas", "nessus", "nmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pyfiglet>=1.0",
    "python-nmap>=0.7.1",
    "scapy>=2.5",
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
vscan = "vscan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vscan*"]

[tool.setuptools.package-data]
vscan = ["i18n/locales/*.json", "report/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
